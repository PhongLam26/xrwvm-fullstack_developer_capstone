name: Capstone CI
on:
  push:
    paths-ignore:
      - 'submission/**'
      - '**/*.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'submission/**'
      - '**/*.md'
      - '.gitignore'
  workflow_dispatch:
jobs:
  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install flake8
      - name: Print working directory
        run: pwd
      - name: Run Linter
        run: |
          python -m flake8 server
          echo "Linted all the python files successfully"
  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JSHint
        run: npm ci
        working-directory: server/database
      - name: Run Linter
        run: |
          npx jshint ./*.js
          echo "Linted all the js files successfully"
        working-directory: server/database
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r server/requirements.txt
      - run: python manage.py check
        working-directory: server
      - run: python manage.py test
        working-directory: server
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: server/frontend
      - run: npm run build
        working-directory: server/frontend
      - run: npm ci && npm test
        working-directory: server/database
      - run: docker compose build
      - name: Build Django deployment image
        run: docker build -t cars-capstone-web .
      - name: Build Code Engine database service image
        run: docker build -t cars-capstone-api -f server/database/Dockerfile.codeengine server/database
