services:
  mongo_db:
    image: mongo:7.0
    volumes:
      - mongo_data:/data/db
  api:
    build: ./server/database
    environment:
      MONGO_URL: mongodb://mongo_db:27017/dealershipsDB
    ports:
      - "3030:3030"
    depends_on:
      - mongo_db
  sentiment:
    build: ./server/djangoapp/microservices
    ports:
      - "5050:5050"
volumes:
  mongo_data:
