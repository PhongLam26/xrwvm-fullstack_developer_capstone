services:
  mongo_db:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      MONGO_URL: mongodb://mongo_db:27017/dealershipsDB
      PORT: "3030"
    ports:
      - "3030:3030"
    depends_on:
      mongo_db:
        condition: service_healthy

volumes:
  mongo_data:
